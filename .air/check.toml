root = "."
tmp_dir = "tmp/air-check"

[build]
  cmd = "go build -o ./tmp/air-check/tunnel-check.exe ./cmd/check"
  entrypoint = ["./tmp/air-check/tunnel-check.exe"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["apps", "docs", "data", "tmp", "node_modules", "target", "dist", "packages", "bin", ".air"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors-check.log"

[log]
  time = false

[color]
  main = "blue"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
