root = "."
tmp_dir = "tmp/air-tunnel"

[build]
  cmd = "go build -o ./tmp/air-tunnel/outpipe-server.exe ./cmd/tunnel"
  entrypoint = ["./tmp/air-tunnel/outpipe-server.exe"]
  include_ext = ["go", "yaml", "yml", "tpl", "tmpl", "html"]
  exclude_dir = ["data", "tmp", "vendor", "bin", ".air"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors-tunnel.log"

[log]
  time = false

[color]
  main = "cyan"
  watcher = "blue"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
