root = "."
tmp_dir = "tmp/air-server"

[build]
  cmd = "go build -o ./tmp/air-server/outpipe-api.exe ./cmd/server"
  entrypoint = ["./tmp/air-server/outpipe-api.exe"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["apps", "docs", "data", "tmp", "node_modules", "vendor", "target", "dist", "packages", "bin", ".air"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors-server.log"

[log]
  time = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
