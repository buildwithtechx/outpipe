root = "."
tmp_dir = "tmp/air-cron"

[build]
  cmd = "go build -o ./tmp/air-cron/tunnel-cron.exe ./cmd/cron"
  entrypoint = ["./tmp/air-cron/tunnel-cron.exe"]
  include_ext = ["go", "yaml", "yml", "tpl", "tmpl", "html"]
  exclude_dir = ["data", "tmp", "vendor", "bin", ".air"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors-cron.log"

[log]
  time = false

[color]
  main = "yellow"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
