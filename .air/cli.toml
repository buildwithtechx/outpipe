root = "."
tmp_dir = "tmp/air-cli"

[build]
  cmd = "go build -o ./tmp/air-cli/outpipe ./cmd/cli"
  bin = "./tmp/air-cli/outpipe"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["apps", "docs", "data", "tmp", "node_modules", "target", "dist", "packages", "bin", ".air"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors-cli.log"

[log]
  time = false

[color]
  main = "green"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
