root = "."
tmp_dir = "tmp/air-cli"

[build]
  cmd = "go build -o ./tmp/air-cli/outpipe.exe ./cmd/cli"
  entrypoint = ["./tmp/air-cli/outpipe.exe"]
  include_ext = ["go", "yaml", "yml", "tpl", "tmpl", "html"]
  exclude_dir = ["data", "tmp", "vendor", "bin", ".air"]
  exclude_file = []
  delay = 1000
  stop_on_error = true
  log = "build-errors-cli.log"

[log]
  time = false

[color]
  main = "green"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
