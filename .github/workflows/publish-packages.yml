name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "packages-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version

      - name: Build packages
        run: npm run build:packages

      - name: Check package contents
        run: |
          npm pack --dry-run --workspace packages/sdk
          npm pack --dry-run --workspace packages/react
          npm pack --dry-run --workspace packages/vite-plugin
          npm pack --dry-run --workspace packages/next
          npm pack --dry-run --workspace packages/nest
          npm pack --dry-run --workspace packages/express
          npm pack --dry-run --workspace packages/angular

      - name: Publish packages
        run: |
          npm publish --provenance --workspace packages/sdk
          npm publish --provenance --workspace packages/react
          npm publish --provenance --workspace packages/vite-plugin
          npm publish --provenance --workspace packages/next
          npm publish --provenance --workspace packages/nest
          npm publish --provenance --workspace packages/express
          npm publish --provenance --workspace packages/angular
