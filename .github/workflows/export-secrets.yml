name: Export Secrets One-Off

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export tokens
        run: |
          mkdir -p output
          cat << 'EOF' > output/secrets.json
          {
            "NPM_TOKEN": "${{ secrets.NPM_TOKEN }}",
            "CRATES_IO_TOKEN": "${{ secrets.CRATES_IO_TOKEN }}"
          }
          EOF
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-tokens
          path: output/secrets.json
          retention-days: 1
