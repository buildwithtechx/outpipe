name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - name: Build Go artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in outpipe-api outpipe outpipe-cron outpipe-check; do
            case "${target}" in
              outpipe-api) source_dir="server" ;;
              outpipe) source_dir="tunnel" ;;
              outpipe-cron) source_dir="cron" ;;
              outpipe-check) source_dir="check" ;;
            esac
            GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${target}_linux_amd64" "./cmd/${source_dir}"
            tar -czf "dist/${target}_linux_amd64.tar.gz" -C dist "${target}_linux_amd64"
            rm "dist/${target}_linux_amd64"
          done
          for platform in linux_amd64 darwin_amd64 darwin_arm64 windows_amd64; do
            os="${platform%_*}"
            arch="${platform#*_}"
            if [ "$os" = "windows" ]; then
              binary="outpipe-cli_${platform}.exe"
              GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${binary}" ./cmd/cli
              (cd dist && zip "${binary%.exe}.zip" "$binary" && rm "$binary")
            else
              binary="outpipe-cli_${platform}"
              GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${binary}" ./cmd/cli
              tar -czf "dist/${binary}.tar.gz" -C dist "$binary"
              rm "dist/${binary}"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Generate release SBOM
        uses: anchore/sbom-action@v0.20.5
        with:
          path: .
          format: spdx-json
          output-file: dist/outpipe-source.spdx.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
