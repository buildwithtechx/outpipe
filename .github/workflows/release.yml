name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Build Go artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in outpipe-api outpipe outpipe-cron outpipe-check; do
            case "${target}" in
              outpipe-api) source_dir="server" ;;
              outpipe) source_dir="tunnel" ;;
              outpipe-cron) source_dir="cron" ;;
              outpipe-check) source_dir="check" ;;
            esac
            GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${target}_linux_amd64" "./cmd/${source_dir}"
            tar -czf "dist/${target}_linux_amd64.tar.gz" -C dist "${target}_linux_amd64"
            rm "dist/${target}_linux_amd64"
          done
          for platform in linux_amd64 darwin_amd64 darwin_arm64 windows_amd64; do
            os="${platform%_*}"
            arch="${platform#*_}"
            if [ "$os" = "windows" ]; then
              binary="outpipe-cli_${platform}.exe"
              GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${binary}" ./cmd/cli
              (cd dist && zip "${binary%.exe}.zip" "$binary" && rm "$binary")
            else
              binary="outpipe-cli_${platform}"
              GOOS="${os}" GOARCH="${arch}" go build -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${binary}" ./cmd/cli
              tar -czf "dist/${binary}.tar.gz" -C dist "$binary"
              rm "dist/${binary}"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  desktop:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb
            bundle-dir: deb
          - os: macos-latest
            bundles: dmg
            bundle-dir: dmg
          - os: windows-latest
            bundles: nsis
            bundle-dir: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - name: Install Rust
        run: rustup default stable
      - run: npm ci
      - name: Build and package desktop app
        working-directory: apps/desktop
        run: npm run build -- --bundles ${{ matrix.bundles }}
      - name: Upload installers
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/${{ matrix.bundle-dir }}/*
