name: CI

on:
  push:
    branches: [main, dev, canary]
  pull_request:
    branches: [main, dev, canary]

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outpipe
          POSTGRES_PASSWORD: outpipe-ci-password
          POSTGRES_DB: outpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outpipe -d outpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - run: go test ./internal/infra/postgres -run TestMigrationRunnerIsRestartSafe -count=1
        env:
          OUTPIPE_MIGRATION_TEST_DSN: postgres://outpipe:outpipe-ci-password@localhost:5432/outpipe?sslmode=disable

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.8"
      - run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/tunnel
          go build -o /dev/null ./cmd/cron
          go build -o /dev/null ./cmd/check
          go build -o /dev/null ./cmd/cli
