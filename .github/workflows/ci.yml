name: CI

on:
  push:
    branches: [main, canary]
  pull_request:
    branches: [main, canary]

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: outpipe
          POSTGRES_PASSWORD: outpipe-ci-password
          POSTGRES_DB: outpipe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outpipe -d outpipe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: go test ./internal/infra/postgres -run TestMigrationRunnerIsRestartSafe -count=1
        env:
          OUTPIPE_MIGRATION_TEST_DSN: postgres://outpipe:outpipe-ci-password@localhost:5432/outpipe?sslmode=disable

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - run: npm run build:web
      - run: npm run typecheck:packages
      - run: npm run test --workspaces --if-present

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - run: go vet ./...
        working-directory: packages/go
      - run: go test ./...
        working-directory: packages/go

  sdk-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check
        working-directory: packages/rust
      - run: cargo test
        working-directory: packages/rust
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: packages/rust

  sdk-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl
          tools: composer
      - run: composer install --no-interaction --prefer-dist
        working-directory: packages/php
      - run: composer validate --strict --no-check-publish
        working-directory: packages/php
      - run: composer test
        working-directory: packages/php
      - run: composer audit --format=plain
        working-directory: packages/php

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
