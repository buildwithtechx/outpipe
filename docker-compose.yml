name: outpipe

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: outpipe
      POSTGRES_USER: outpipe
      POSTGRES_PASSWORD: outpipe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outpipe -d outpipe"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - outpipe-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      network: host
    environment:
      OUTPIPE_PORT: 8080
      OUTPIPE_INTERNAL_LISTEN_ADDRESS: 0.0.0.0:9090
      OUTPIPE_DATABASE_URL: postgres://outpipe:outpipe@postgres:5432/outpipe?sslmode=disable
      OUTPIPE_REDIS_HOST: redis
      OUTPIPE_INTERNAL_API_SECRET: local-internal-secret
      OUTPIPE_AUTH_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      OUTPIPE_PUBLIC_API_URL: http://localhost:18080
      OUTPIPE_DASHBOARD_URL: http://localhost:13000
      OUTPIPE_CORS_ORIGIN: http://localhost:13000
      OUTPIPE_ALLOWED_ORIGINS: http://localhost:13000
      OUTPIPE_AUTH_COOKIE_SECURE: "false"
    ports:
      - "18080:8080"
      - "19090:9090"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.tunnel
      network: host
    environment:
      OUTPIPE_PORT: 8081
      OUTPIPE_REDIS_HOST: redis
      OUTPIPE_INTERNAL_API_URL: http://api:9090
      OUTPIPE_INTERNAL_API_SECRET: local-internal-secret
      OUTPIPE_TUNNEL_DOMAIN: localhost
      OUTPIPE_ALLOWED_ORIGINS: http://localhost:13000
    ports:
      - "18181:8081"
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:24
    working_dir: /workspace
    command: npm run dev --workspace apps/web -- --host 0.0.0.0
    environment:
      VITE_OUTPIPE_API_BASE_URL: http://localhost:18080
    ports:
      - "13000:3000"
    volumes:
      - .:/workspace:Z
    depends_on:
      api: { condition: service_healthy }

volumes:
  outpipe-postgres:
