app:
  port: "8080"
  internal_listen_address: "127.0.0.1:9090"
  name: "outpipe"
  environment: "production"
  log_level: "info"
  shutdown_timeout: 15s
  allowed_origins: "https://app.outpipe.dev,https://outpipe.dev"
  cors_origin: "https://app.outpipe.dev"
  public_api_url: "https://api.outpipe.dev"
  dashboard_url: "https://app.outpipe.dev"
  require_tls: true
  tls_cert_file: "/etc/outpipe/certs/fullchain.pem"
  tls_key_file: "/etc/outpipe/certs/privkey.pem"
  acme_enabled: false
  acme_email: "ops@outpipe.dev"
  acme_directory: "https://acme-v02.api.letsencrypt.org/directory"
  certificate_cache_dir: "/var/lib/outpipe/acme"

database:
  max_conns: 50
  max_lifetime: 30m
  max_idle_time: 5m

redis:
  host: "redis"
  port: "6379"
  db: 0

tunnel:
  domain: "outpipe.app"
  token_ttl: 24h
  max_connections: 50000
  max_tunnels: 50000
  max_bytes: 0
  max_bandwidth: 0
  heartbeat_interval: 20s
  read_timeout: 90s
  drain_timeout: 15s
  agent_inactivity_timeout: 90s
  max_frame_bytes: 16777216
  require_tls: true

auth:
  session_ttl: 720h
  device_login_ttl: 10m
  invitation_ttl: 168h
  oauth_state_ttl: 10m
  cookie_name: "outpipe_session"
  cookie_secure: true
  cookie_domain: ".outpipe.dev"

billing:
  grace_period: 72h
  polar_server: "production"
  polar_base_url: "https://api.polar.sh"
  polar_product_link: "prod_link_prod"
  polar_product_route: "prod_route_prod"
  polar_product_edge: "prod_edge_prod"
  polar_product_link_yearly: "prod_link_yearly_prod"
  polar_product_route_yearly: "prod_route_yearly_prod"
  polar_product_edge_yearly: "prod_edge_yearly_prod"
  paystack_base_url: "https://api.paystack.co"

mail:
  from_address: "noreply@outpipe.dev"
  support: "support@outpipe.dev"
  zepto_url: "https://api.zeptomail.com/v1.1/email"

analytics:
  tinybird_url: "https://api.europe-west2.gcp.tinybird.co"
  tinybird_datasource: "outpipe_telemetry"
  clickhouse_url: ""
  clickhouse_database: "default"
  clickhouse_table: "outpipe_telemetry"

service:
  internal_api_url: "http://127.0.0.1:9090"

agent:
  default_provider: "openai"
  model: "gpt-4o"
