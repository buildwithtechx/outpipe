app:
  port: "8080"
  internal_listen_address: "127.0.0.1:9090"
  name: "outpipe-cron"
  environment: "development"
  log_level: "info"
  shutdown_timeout: 10s
  allowed_origins: "http://localhost:3000,http://localhost:3001,http://localhost:4322"
  cors_origin: "http://localhost:3000"
  public_api_url: "http://localhost:8080"
  dashboard_url: "http://localhost:3000"
  status_base_url: "http://localhost:4322"
  require_tls: false
  acme_enabled: false
  acme_email: "admin@outpipe.dev"
  acme_directory: "https://acme-staging-v02.api.letsencrypt.org/directory"
  certificate_cache_dir: ".data/acme"
  challenge_zone: ""
  challenge_dns_provider: ""

auth:
  session_ttl: 720h
  device_login_ttl: 10m
  invitation_ttl: 168h
  oauth_state_ttl: 10m
  cookie_name: "outpipe_session"
  cookie_secure: false
  cookie_domain: ""

analytics:
  tinybird_url: "https://api.europe-west2.gcp.tinybird.co"
  tinybird_datasource: "outpipe_telemetry"
  clickhouse_url: "http://localhost:8123"
  clickhouse_user: "default"
  clickhouse_database: "default"
  clickhouse_table: "outpipe_telemetry"

database:
  max_conns: 5
  max_lifetime: 30m
  max_idle_time: 5m

redis:
  host: "localhost"
  port: "6379"
  db: 0

service:
  internal_api_url: "http://127.0.0.1:9090"

backup:
  directory: "data/backups"
  keep: 7
  pg_dump_path: "pg_dump"
  pg_restore_path: "pg_restore"

mail:
  from_address: "noreply@localhost"
  support: "support@outpipe.dev"
  zepto_url: "https://api.zeptomail.com/v1.1/email"

metrics: false
